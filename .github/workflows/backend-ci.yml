name: Backend CI

# FIX (backend-takeover audit, Pass 12 follow-up): no automated pipeline
# ran typecheck, lint, or tests on push/PR before this — every check in
# this audit (AUDIT.md) was run manually, pass by pass. This workflow is
# the safety net: it runs the same checks (install, typecheck, lint,
# build, test) automatically, including the real-Postgres billing-
# reconciliation suite (test/billing/) against the exact migration chain
# in src/db/migrations/, so a future change can't silently reintroduce
# either bug that suite exists to catch.

on:
  push:
    branches:
      - develop
      - main
      - 'backend-takeover/**'
  pull_request:
    branches:
      - develop
      - main

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Admin connection the billing-reconciliation suite uses to create
      # and drop its own throwaway database on this service container —
      # see test/helpers/testDb.ts and test/README.md.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
