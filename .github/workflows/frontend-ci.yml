name: Frontend CI

# Typecheck, lint and unit/integration tests for the Expo app. The Maestro
# smoke suite (frontend/.maestro) needs a device build and a seeded backend, so
# it is run manually (workflow_dispatch) rather than on every push.

on:
  push:
    branches:
      - develop
      - main
      - 'feature/mobile-frontend-**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
